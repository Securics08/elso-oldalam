<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Neon HTML Repo - Pro Copy 2026</title>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 340px; background: #0a0a0a; border-right: 2px solid #222; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .main { flex: 1; display: flex; flex-direction: column; }
        
        h2 { color: #00f6ff; text-shadow: 0 0 15px #00f6ff; font-size: 22px; margin: 0 0 15px 0; text-align: center; letter-spacing: 2px; font-weight: 800; }
        .storage-bar { width: 100%; height: 8px; background: #111; border-radius: 4px; overflow: hidden; margin-bottom: 20px; border: 1px solid #333; }
        #storageFill { height: 100%; width: 0%; background: linear-gradient(90deg, #00f6ff, #0055ff); box-shadow: 0 0 10px #00f6ff; transition: 0.5s; }

        input, textarea, button { background: #161616; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 8px; outline: none; margin-bottom: 10px; font-size: 14px; }
        textarea { flex: 1; width: 100%; resize: none; font-family: 'Consolas', 'Courier New', monospace; color: #0f0; font-size: 14px; background: #000; border: 1px solid #0f04; line-height: 1.5; }
        
        .editor-section { height: 45%; display: flex; flex-direction: column; padding: 10px; border-bottom: 2px solid #333; background: #000; }
        .preview-section { height: 55%; display: flex; flex-direction: column; background: #fff; }
        iframe { flex: 1; border: none; background: #fff; }

        .toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
        button { cursor: pointer; font-weight: bold; font-size: 11px; flex: 1; border: 1px solid transparent; transition: 0.3s; text-transform: uppercase; }
        button:hover { filter: brightness(1.3); transform: scale(1.02); }
        
        .btn-save { background: #0055ff; border-color: #00f6ff; box-shadow: 0 0 15px #0055ff66; }
        .btn-copy { background: #0088ff; border-color: #00ccff; box-shadow: 0 0 10px #0088ff44; flex: 1 !important; }
        .btn-del { background: #aa0000; border-color: #ff4444; }
        .btn-run { background: #0f0; color: #000; font-size: 15px; flex: 2; box-shadow: 0 0 20px #0f08; }
        .btn-imp { background: #d47a00; border-color: #ff9d00; }
        .btn-exp { background: #7a00d4; border-color: #a600ff; }

        #fileList { flex: 1; overflow-y: auto; padding-right: 8px; margin-top: 10px; }
        #fileList::-webkit-scrollbar { width: 5px; }
        #fileList::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .file-item { 
            padding: 15px; margin-bottom: 12px; background: #141414; border-radius: 10px; 
            cursor: pointer; border: 1px solid #222; transition: 0.3s ease-in-out;
            position: relative; overflow: hidden;
        }
        .file-item:hover { background: #1c1c1c; border-color: #555; transform: translateX(5px); }
        .file-item strong { display: block; font-size: 16px; margin-bottom: 6px; letter-spacing: 0.5px; font-weight: 700; }
        .file-item small { color: #888; font-size: 11px; font-family: monospace; }
        .file-item.active { background: #222; border-color: #00f6ff44; }

        .reset-btn { background: #440000; font-size: 10px; border-color: #880000; margin-top: 10px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>📁 NEON REPO</h2>
    <div style="font-size:11px; color:#00f6ff; margin-bottom:6px; font-weight: bold;">TÁRHELY: <span id="storageTxt">0 MB / 500 MB</span></div>
    <div class="storage-bar"><div id="storageFill"></div></div>

    <input type="text" id="fileName" placeholder="Projekt neve..." autocomplete="off">
    <div class="toolbar">
        <button class="btn-save" onclick="saveToDB()">MENTÉS + JSON</button>
        <button onclick="newProj()">ÚJ</button>
        <button class="btn-del" onclick="deleteFromDB()">TÖRÖL</button>
    </div>

    <div id="fileList"></div>
    
    <div class="toolbar">
        <button class="btn-imp" onclick="importData()">IMPORT</button>
        <button class="btn-exp" onclick="exportData()">EXPORT</button>
    </div>
    <button class="reset-btn" onclick="clearAllData()">RENDSZER RESET (TÖRLÉS)</button>
</div>

<div class="main">
    <div class="editor-section">
        <div class="toolbar">
            <span style="color:#ffff00; font-size:12px; padding-top:10px; font-weight: bold;">KÓD SZERKESZTŐ</span>
            <button class="btn-copy" onclick="copyCode()">KÓD MÁSOLÁSA 📋</button>
            <button class="btn-run" onclick="runCode()">KÓD FUTTATÁSA ▶</button>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="Ide írd a HTML kódot..."></textarea>
    </div>
    <div class="preview-section">
        <div style="background:#0a0a0a; color:#0f0; padding:8px 20px; font-size:12px; border-bottom:1px solid #333; font-weight: bold;">ELŐNÉZET</div>
        <iframe id="preview"></iframe>
    </div>
</div>

<script>
    let db;
    let activeId = null;
    const neonColors = ["#00f6ff", "#0f0", "#f0f", "#ff0", "#f40", "#08f"];

    const request = indexedDB.open("NeonRepoV5", 1);
    request.onupgradeneeded = e => {
        db = e.target.result;
        db.createObjectStore("projects", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = e => {
        db = e.target.result;
        loadList();
    };

    function copyCode() {
        const editor = document.getElementById("editor");
        editor.select();
        document.execCommand("copy");
        const btn = document.querySelector(".btn-copy");
        const originalText = btn.innerText;
        btn.innerText = "MÁSOLVA! ✓";
        btn.style.background = "#00ff88";
        btn.style.color = "#000";
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "#0088ff";
            btn.style.color = "#fff";
        }, 1500);
    }

    function downloadFile(content, fileName) {
        const blob = new Blob([content], {type: "application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function saveToDB() {
        if (!db) return;
        const name = document.getElementById("fileName").value.trim() || "Névtelen_" + Date.now();
        const code = document.getElementById("editor").value;
        const color = neonColors[Math.floor(Math.random() * neonColors.length)];
        const tx = db.transaction("projects", "readwrite");
        const store = tx.objectStore("projects");
        const data = { name, code, color, time: new Date().toLocaleString() };
        if (activeId) data.id = activeId;
        
        store.put(data).onsuccess = e => {
            activeId = activeId || e.target.result;
            loadList();
            
            const finalFileName = "Neon_Repo_(html-Save)_" + name.replace(/\s+/g, '_') + "_mentése.json";
            downloadFile(JSON.stringify(data, null, 2), finalFileName);
        };
    }

    function loadList() {
        if (!db) return;
        const tx = db.transaction("projects", "readonly");
        tx.objectStore("projects").getAll().onsuccess = e => {
            const list = document.getElementById("fileList");
            list.innerHTML = "";
            let size = 0;
            e.target.result.forEach(item => {
                size += new Blob([item.code]).size;
                const div = document.createElement("div");
                div.className = "file-item" + (activeId === item.id ? " active" : "");
                div.style.borderLeft = `6px solid ${item.color}`;
                div.innerHTML = `<strong style="color:${item.color}">${item.name}</strong><small>${item.time}</small>`;
                div.onclick = () => {
                    activeId = item.id;
                    document.getElementById("fileName").value = item.name;
                    document.getElementById("editor").value = item.code;
                    loadList();
                    runCode();
                };
                list.appendChild(div);
            });
            updateMem(size);
        };
    }

    function runCode() {
        const code = document.getElementById("editor").value;
        const blob = new Blob([code], { type: 'text/html' });
        document.getElementById("preview").src = URL.createObjectURL(blob);
    }

    function updateMem(bytes) {
        const mb = (bytes / (1024 * 1024)).toFixed(2);
        document.getElementById("storageTxt").innerText = `${mb} MB / 500 MB`;
        document.getElementById("storageFill").style.width = Math.min((bytes / (500 * 1024 * 1024) * 100), 100) + "%";
    }

    function newProj() {
        activeId = null;
        document.getElementById("fileName").value = "";
        document.getElementById("editor").value = "";
        document.getElementById("preview").src = "about:blank";
        loadList();
    }

    function deleteFromDB() {
        if (!activeId || !confirm("Törlöd?")) return;
        db.transaction("projects", "readwrite").objectStore("projects").delete(activeId).onsuccess = newProj;
    }

    function exportData() {
        const now = new Date();
        const timestamp = now.getFullYear() + "-" + 
                        String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                        String(now.getDate()).padStart(2, '0') + "_" + 
                        String(now.getHours()).padStart(2, '0') + "-" + 
                        String(now.getMinutes()).padStart(2, '0');
        
        let userFileName = prompt("Export név:", "Neon_Repo_Export_" + timestamp);
        if (!userFileName) return;
        
        db.transaction("projects", "readonly").objectStore("projects").getAll().onsuccess = e => {
            downloadFile(JSON.stringify(e.target.result, null, 2), userFileName.replace(/\s+/g, '_') + ".json");
        };
    }

    function importData() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json";
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    const tx = db.transaction("projects", "readwrite");
                    const store = tx.objectStore("projects");
                    const items = Array.isArray(data) ? data : [data];
                    items.forEach(item => { delete item.id; store.put(item); });
                    tx.oncomplete = () => loadList();
                } catch(err) { alert("Hiba!"); }
            };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }

    function clearAllData() {
        if (confirm("Minden törlődik! Biztos?")) {
            db.transaction("projects", "readwrite").objectStore("projects").clear().onsuccess = newProj;
        }
    }
</script>
</body>
</html>
